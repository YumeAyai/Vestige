name: Tracking SCF CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Tencent Cloud SCF after packaging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  SCF_PACKAGE: tracking-scf.zip
  SCF_BINARY: main
  SCF_FUNCTION_DIR: functions/jianji

jobs:
  package:
    name: Package tracking SCF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify SCF entrypoint exists
        run: test -d tracking-server/cmd/scf

      - name: Test Go packages
        run: go test ./...

      - name: Build Linux function binary
        run: sh scripts/build-tcb-function.sh

      - name: Create deploy package
        working-directory: ${{ env.SCF_FUNCTION_DIR }}
        run: zip -9 "../../$SCF_PACKAGE" "$SCF_BINARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracking-scf-package
          path: ${{ env.SCF_PACKAGE }}
          if-no-files-found: error

      - name: Install Tencent Cloud CLI
        if: inputs.deploy
        run: python -m pip install --upgrade tccli

      - name: Deploy function code
        if: inputs.deploy
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ secrets.TENCENTCLOUD_REGION }}
          SCF_FUNCTION_NAME: ${{ secrets.SCF_FUNCTION_NAME }}
          SCF_NAMESPACE: ${{ secrets.SCF_NAMESPACE }}
        run: |
          test -n "$TENCENTCLOUD_SECRET_ID"
          test -n "$TENCENTCLOUD_SECRET_KEY"
          test -n "$TENCENTCLOUD_REGION"
          test -n "$SCF_FUNCTION_NAME"
          tccli configure set secretId "$TENCENTCLOUD_SECRET_ID"
          tccli configure set secretKey "$TENCENTCLOUD_SECRET_KEY"
          tccli configure set region "$TENCENTCLOUD_REGION"
          tccli scf UpdateFunctionCode \
            --FunctionName "$SCF_FUNCTION_NAME" \
            --Namespace "${SCF_NAMESPACE:-default}" \
            --Handler "$SCF_BINARY" \
            --ZipFile "fileb://$SCF_PACKAGE"
